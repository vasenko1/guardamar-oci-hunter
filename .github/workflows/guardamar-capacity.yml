name: Guardamar OCI capacity search
on:
  schedule:
    - cron: "3-58/5 * * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "Termux-compatible launch action (separately owner-authorized)"
        type: choice
        required: true
        default: none
        options:
          - none
          - launch
      mode:
        description: "Tests only (default) or explicitly authorized read-only OCI audit"
        type: choice
        required: true
        default: tests
        options:
          - tests
          - audit
          - candidate
permissions:
  contents: read
concurrency:
  group: guardamar-capacity-search
  cancel-in-progress: false
jobs:
  tests:
    if: github.event_name == 'workflow_dispatch' && inputs.action != 'launch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
  audit:
    needs: tests
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.ref_protected == true && inputs.action != 'launch' && (inputs.mode == 'audit' || inputs.mode == 'candidate')
    environment: oci-readonly
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install "oci==2.185.2"
      - name: Run read-only OCI audit
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_COMPARTMENT_OCID: ${{ secrets.OCI_COMPARTMENT_OCID }}
          OCI_AVAILABILITY_DOMAIN: ${{ secrets.OCI_AVAILABILITY_DOMAIN }}
          OCI_IMAGE_OCID: ${{ secrets.OCI_IMAGE_OCID }}
          OCI_SUBNET_OCID: ${{ secrets.OCI_SUBNET_OCID }}
          OCI_TARGET_DISPLAY_NAME: ${{ secrets.OCI_TARGET_DISPLAY_NAME }}
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
          SELECTED_AUDIT_MODE: ${{ inputs.mode }}
        run: |
          if [ "$SELECTED_AUDIT_MODE" = "candidate" ]; then
            python -m automation.oci_launch_candidate audit
          else
            python -m automation.guardamar_capacity audit
          fi

  capacity:
    # This job MUST NOT exist in the active default branch until old writer
    # has been DISABLED and all queued/running old runs have finished.
    # A cross-repository concurrency group provides NO exclusion.
    if: >-
      github.ref == 'refs/heads/main' &&
      github.ref_protected == true &&
      github.run_attempt == 1 &&
      (
        github.event_name == 'schedule' ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.action == 'launch'
        )
      )
    # Reuse the nine OCI secrets already validated by live candidate audit.
    # The original SSH public key is the only missing runtime selector.
    environment: oci-readonly
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      disable_schedule: ${{ steps.capacity.outputs.disable_schedule }}
    steps:
      - name: Checkout protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned OCI SDK
        run: python -m pip install "oci==2.185.2"
      - name: Run exactly one bounded capacity attempt
        id: capacity
        continue-on-error: true
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_COMPARTMENT_OCID: ${{ secrets.OCI_COMPARTMENT_OCID }}
          OCI_AVAILABILITY_DOMAIN: ${{ secrets.OCI_AVAILABILITY_DOMAIN }}
          OCI_IMAGE_OCID: ${{ secrets.OCI_IMAGE_OCID }}
          OCI_SUBNET_OCID: ${{ secrets.OCI_SUBNET_OCID }}
          OCI_TARGET_DISPLAY_NAME: ${{ secrets.OCI_TARGET_DISPLAY_NAME }}
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
          # Same already-tested CLI safety gate as the original Hunter.
          # Workflow must NOT be merged until the old creator is stopped.
          GUARDAMAR_LAUNCH_SWITCH: OWNER_AUTHORIZED_PHASE_2
        run: python -m automation.oci_launch_candidate launch --allow-launch
      - name: Preserve blocked result
        if: steps.capacity.outcome == 'failure'
        run: exit 1

  disable:
    needs: capacity
    if: always() && needs.capacity.outputs.disable_schedule == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: none
    steps:
      - name: Stop successful or unsafe capacity search
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api --method PUT
          "repos/${GITHUB_REPOSITORY}/actions/workflows/guardamar-capacity.yml/disable"
