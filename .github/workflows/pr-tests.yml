name: Public OCI candidate offline checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: public-oci-pr-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  public-audit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out proposed changes without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check Python module syntax
        run: python -m py_compile automation/guardamar_capacity.py tests/test_guardamar_capacity.py
      - name: Run read-only candidate regression tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -v
